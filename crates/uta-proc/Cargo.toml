[package]
name = "uta-proc"
version = "0.0.0"
description = "OS process identity, exit confirmation and orphan reclamation for UTA child processes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "1.53.1", features = ["time"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt"] }
