[package]
name = "uta-core"
version = "0.0.0"
description = "The UTA core daemon: instance fence, core thread, controlled stop."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uta-base = { path = "../uta-base" }
uta-proc = { path = "../uta-proc" }
uta-store = { path = "../uta-store" }

[lints]
workspace = true

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.5", features = ["process"] }
