[package]
name = "uta-store"
version = "0.0.0"
description = "Single-writer SQLite store of the UTA core: format versions, instance table, process table, typed transactions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2"
uta-base = { path = "../uta-base" }
uta-proc = { path = "../uta-proc" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
