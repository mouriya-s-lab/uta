[package]
name = "uta-rpc"
version = "0.0.0"
description = "Symmetric JSON-RPC 2.0 peer over length-delimited frames; every call completes exactly once, no timeouts, no retries."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "sync", "macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

[lints]
workspace = true
